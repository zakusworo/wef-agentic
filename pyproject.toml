[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wef-agentic"
version = "0.1.0"
description = "Function-based agentic AI readiness assessment for sub-national WEF Nexus governance — Sleman case study"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Zulfikar Aji Kusworo", email = "greataji13@gmail.com" },
]
keywords = ["water-energy-food", "agentic-ai", "wef-nexus", "sleman", "governance"]

dependencies = [
    # LLM providers (Claude Agent SDK is optional: pip install -e ".[claude]")
    "ollama>=0.4.0",
    "httpx>=0.27.0",

    # Data
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyarrow>=16.0.0",

    # Viz + UI
    "streamlit>=1.36.0",
    "plotly>=5.20.0",
    "matplotlib>=3.8.0",
    "reportlab>=4.0.0",

    # Config
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",

    # Utilities
    "tenacity>=8.3.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
claude = [
    "claude-agent-sdk>=0.1.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]
phase1 = [
    "xclim>=0.50.0",
    "scikit-learn>=1.5.0",
    "xgboost>=2.0.0",
    "pymcdm>=1.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wef_agentic"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "RUF"]
ignore = ["E501", "RUF001", "RUF002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-v --tb=short"
